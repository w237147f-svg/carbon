<!DOCTYPE HTML>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>蛍光灯アイコン付きパノラマ</title>
    
    <!-- PannellumのCSS/JSライブラリを読み込む -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        #panorama {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>

<div id="panorama"></div>

<script>
    pannellum.viewer('panorama', {
        "type": "equirectangular",
        "panorama": "image_5193cb.jpg", // 元の画像をそのまま参照
        "autoLoad": true,
        "compass": true,
        "hotSpots": [
            {
                // 中央付近の照明（天井）の位置
                "pitch": 48.0,
                "yaw": -3.0,
                "type": "info",
                "text": "天井の蛍光灯（照明設備）"
            },
            {
                // 教室奥・右側の照明の位置
                "pitch": 38.0,
                "yaw": 45.0,
                "type": "info",
                "text": "窓際の蛍光灯"
            }
        ]
    });
</script>

</body>
</html>
