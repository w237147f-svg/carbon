<!DOCTYPE HTML>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>パノラマ（強制描画アイコン）</title>
    <!-- Pannellum CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    
    <style>
        body { margin: 0; padding: 0; overflow: hidden; }
        #panorama { width: 100vw; height: 100vh; }

        /* ★直接定義した「濃い赤」のアイコン要素 */
        .force-red-icon {
            width: 32px;
            height: 32px;
            background-color: #8B0000 !important; /* 濃い赤 */
            border: 2px solid #ffffff !important;   /* 白いフチ */
            border-radius: 50% !important;
            box-shadow: 0 0 10px rgba(0,0,0,0.8) !important;
            cursor: pointer;
            z-index: 999999 !important; /* 絶対に最前面に表示 */
            display: block !important;
        }
    </style>
</head>
<body>

<div id="panorama"></div>

<script>
// パノラマビューワーの初期化
var viewer = pannellum.viewer('panorama', {
    "type": "equirectangular",
    "panorama": "image_5193cb.jpg",
    "autoLoad": true,
    "pitch": 20, /* 初期視点を上（蛍光灯側）に設定 */
    "yaw": 0,
    "hfov": 100
});

// パノラマの準備が整ったら画面上に直接アイコンを設置する
viewer.on('load', function() {
    
    // 自作した濃い赤のHTML要素を作成
    var redDomElement = document.createElement('div');
    redDomElement.className = 'force-red-icon';
    redDomElement.title = "天井の蛍光灯";
    
    // クリック時に文字が出るアクション
    redDomElement.addEventListener('click', function() {
        alert("天井の蛍光灯（照明設備）です");
    });

    // ビューワーの画面上（正面・天井付近）に動的に追加
    viewer.addHotSpot({
        "pitch": 25, /* カメラ正面の少し上（蛍光灯） */
        "yaw": 0,    /* カメラ正面 */
        "createTooltipFunc": function(container) {
            container.appendChild(redDomElement);
        }
    });

});
</script>

</body>
</html>
