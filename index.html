<!DOCTYPE HTML>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>360度パノラマビューワー</title>
    
    <!-- Pannellumのスタイルシートを読み込む -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <!-- PannellumのJavaScriptを読み込む -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    
    <style>
        /* 画面いっぱいに表示するための設定 */
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        #panorama {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>

<!-- パノラマを表示する要素 -->
<div id="panorama"></div>

<script>
    // Pannellumの初期化
    pannellum.viewer('panorama', {
        "type": "equirectangular",       // パノラマ画像の種類（正距円筒図法）
        "panorama": "image_5193cb.jpg",  // 読み込む画像ファイル名
        "autoLoad": true,                // ページを開いた時に自動的に読み込む
        "compass": true                  // お好みでコンパスを表示
    });
</script>

</body>
</html>
