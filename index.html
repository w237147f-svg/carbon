<!DOCTYPE HTML>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>蛍光灯パノラマビューワー（脱炭素クイズ）</title>
    <!-- Pannellum CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>

    <style>
        body { margin: 0; padding: 0; overflow: hidden; font-family: sans-serif; }
        #panorama { width: 100vw; height: 100vh; }

        /* 電球アイコン設定 */
        .force-bulb-icon {
            width: 45px !important;
            height: 45px !important;
            background-image: url('images.png') !important;
            background-size: contain !important;
            background-repeat: no-repeat !important;
            background-position: center !important;
            cursor: pointer;
            z-index: 99999 !important;
            display: block !important;
            pointer-events: auto;
            filter: drop-shadow(0px 0px 6px rgba(255, 255, 255, 0.9));
            transition: transform 0.2s ease-in-out;
        }

        .force-bulb-icon:hover {
            transform: scale(1.2);
        }

        /* 問題表示用モーダルのデザイン */
        .quiz-modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background-color: rgba(0, 0, 0, 0.6);
            z-index: 999999;
            align-items: center;
            justify-content: center;
        }

        .quiz-content {
            background-color: #ffffff;
            padding: 24px;
            border-radius: 12px;
            width: 85%;
            max-width: 420px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            text-align: center;
        }

        .quiz-title {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 12px;
        }

        .quiz-question {
            font-size: 14px;
            color: #444;
            margin-bottom: 20px;
            line-height: 1.6;
            text-align: left;
        }

        .quiz-btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            background-color: #f8f9fa;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            color: #333;
            cursor: pointer;
            text-align: left;
            transition: background 0.2s;
        }

        .quiz-btn:hover {
            background-color: #e9ecef;
        }

        .close-btn {
            margin-top: 15px;
            background-color: #8B0000;
            color: #fff;
            border: none;
            padding: 8px 20px;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div id="panorama"></div>

<!-- 脱炭素クイズ画面 -->
<div id="quizModal" class="quiz-modal">
    <div class="quiz-content">
        <div class="quiz-title">💡 脱炭素クイズ：照明編</div>
        <div class="quiz-question">部屋の照明を使うとき、**最も脱炭素（CO2削減）に貢献する行動**はどれでしょう？</div>
        
        <button class="quiz-btn" onclick="checkAnswer(1)">① 省エネ性能が高い「LED照明」に買い替えて使う</button>
        <button class="quiz-btn" onclick="checkAnswer(2)">② つけ直す電力を避けるため、部屋にいない時もつけっぱなしにする</button>
        <button class="quiz-btn" onclick="checkAnswer(3)">③ こまめに新しい蛍光灯に取り替え続ける</button>
        
        <button class="close-btn" onclick="closeQuiz()">閉じる</button>
    </div>
</div>

<script>
var viewer = pannellum.viewer('panorama', {
    "type": "equirectangular",
    "panorama": "image_5193cb.jpg",
    "autoLoad": true,
    "pitch": 30,
    "yaw": 0,
    "hfov": 100
});

viewer.on('load', function() {
    viewer.addHotSpot({
        "pitch": 48,
        "yaw": 0,
        "cssClass": "force-bulb-icon",
        "clickHandlerFunc": function(event, args) {
            openQuiz();
        }
    });
});

function openQuiz() {
    document.getElementById('quizModal').style.display = 'flex';
}

function closeQuiz() {
    document.getElementById('quizModal').style.display = 'none';
}

function checkAnswer(option) {
    if (option === 1) {
        alert("正解です！👏\nLED照明は従来の蛍光灯に比べて消費電力が約半分割減され、大幅なCO2削減（脱炭素）につながります！");
        closeQuiz();
    } else if (option === 2) {
        alert("不正解です！\n不在時のつけっぱなしは無駄な電力を消費してしまいます。");
    } else {
        alert("不正解です！\nまだ使えるものを頻繁に買い替えるのは製造や処分のコストがかかり脱炭素にはなりません。");
    }
}
</script>

</body>
</html>
